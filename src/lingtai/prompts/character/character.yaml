kind: prompt-section-definition
section: character
name_definition: >
  "character" is retired. No separately injected LingTai character owner remains.
purpose: >
  Record retirement without deleting legacy agent memory sources.
scope:
  owns:
    - Retirement record and route to unified private Pad memory.
  does_not_own:
    - A source reader, character loader, injection or compatibility alias.
injection_contract:
  defined_by: literal_retirement
  injected_by: no_consumer
  content_source: no_active_source
  override_policy: legacy_inputs_preserved_once_in_pad
  notes: >
    system/lingtai.md is preserved once into system/pad.md by the Pad composer,
    without modifying the source. A one-time marker prevents ongoing re-append.
    Old lingtai/lingtai_file strings remain accepted one-way migration inputs;
    forced/self-evolve modes are retired and new templates omit the old keys.
related_files:
  - path: src/lingtai/prompts/ANATOMY.md
    why: Prompt-source navigation and retirement records.
  - path: src/lingtai/tools/lingtai/_lingtai.py
    why: Retired implementation record; no loader remains.
  - path: src/lingtai/tools/pad/_pad.py
    why: Owns one-time non-destructive preservation and unified Pad composition.
  - path: src/lingtai/prompts/identity/identity.yaml
    why: Mechanical identity is unchanged and is not private memory.
  - path: src/lingtai/prompts/pad/pad.yaml
    why: Unified injected private memory owns former character content.
  - path: src/lingtai/prompts/covenant/covenant.yaml
    why: The operator contract remains separate and unchanged.
maintenance:
  - Do not restore the retired loader, config modes, character injection or aliases.
  - Keep Pad preservation and mechanical identity boundaries explicit; no kernel body.
